<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PoseFit Web — AI Workout Form Coach & Rep Counter</title>
    <!-- Prevent theme flash before React mounts -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('posefit-theme');
          var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'light' || (!stored && !supportDark)) {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
    <!-- MediaPipe Pose (Loaded locally with automatic CDN fallback) -->
    <script src="/mediapipe/pose/pose.js"></script>
  </head>
  <body class="overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
