[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posefit"
version = "0.1.0"
description = "Pure-Python, optimized, local-first kinematics engine and backend for PoseFit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aman Yadav", email = "amanyadav2030a@gmail.com" }
]
dependencies = [
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fast = [
    "orjson>=3.9.0",
    "msgpack>=1.0.0",
]
vision = [
    "opencv-python-headless>=4.8.0",
    "mediapipe>=0.10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
]
all = [
    "posefit[fast,vision,dev]",
]

[project.scripts]
posefit = "posefit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
posefit = ["assets/exercises/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "mediapipe.*",
    "cv2.*",
    "orjson.*",
    "msgpack.*",
    "uvloop.*",
    "watchfiles.*",
    "pytest_asyncio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
