# Mountain Climber Exercise Definition
# Bilateral dynamic movement - left and right knees tracked independently

name: mountain_climber
display_name: "Mountain Climber"
type: repetition
bilateral: true

sides:
  - left
  - right

target_muscles:
  - Core
  - Hip Flexors
  - Shoulders
equipment: "Bodyweight"
difficulty: intermediate
default_reps: 20
default_sets: 3
description: "Dynamic cardio with alternating knee drives"

angles:
  left:
    points: [left_shoulder, left_hip, left_knee]
    description: "Left hip angle"

  right:
    points: [right_shoulder, right_hip, right_knee]
    description: "Right hip angle"

  primary:
    points: [left_shoulder, left_hip, left_knee]
    description: "Left hip angle"

  right_side:
    points: [right_shoulder, right_hip, right_knee]
    description: "Right hip angle"

state_order:
  - tucked
  - driving
  - extended

states:
  extended:
    condition: "angle > 160"
    description: "Leg extended straight in plank"
  
  driving:
    condition: "angle > 90 and angle <= 160"
    description: "Driving knee forward towards chest"
  
  tucked:
    condition: "angle <= 90"
    description: "Knee tucked fully forward - rep counted"

counter:
  trigger_state: tucked
  from_state: driving

min_rep_duration: 0.2

feedback:
  hips_high:
    condition: "angle < 70"
    message: "Keep hips level with shoulders - avoid piking up!"
    severity: info

visualization:
  lines:
    - points: [left_hip, left_knee]
      color: [255, 0, 0]
      thickness: 4
    - points: [right_hip, right_knee]
      color: [255, 0, 0]
      thickness: 4
