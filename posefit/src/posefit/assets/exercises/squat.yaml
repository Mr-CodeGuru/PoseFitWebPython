# Squat Exercise Definition
# Target muscles: Quadriceps, Gluteus, Hamstrings

name: squat
display_name: "Squat"
type: repetition

# Meta information
target_muscles:
  - Quadriceps
  - Gluteus
  - Hamstrings
equipment: "Bodyweight or Barbell"
difficulty: beginner
default_reps: 10
default_sets: 3
rest_time: "60 seconds"
benefits:
  - "Builds lower body strength"
  - "Improves mobility and balance"
  - "Strengthens core muscles"
description: "Basic squat exercise targeting lower body muscles"

# Angle definitions
angles:
  primary:
    points: [left_shoulder, left_hip, left_knee]
    description: "Left torso-hip-knee angle"
  
  right_side:
    points: [right_shoulder, right_hip, right_knee]
    description: "Right torso-hip-knee angle"

# Finite State Machine (FSM)
# Evaluation order: first matching condition activates
state_order:
  - ascent
  - descent
  - start

states:
  start:
    condition: "angle > 165"
    description: "Starting position - standing upright"
  
  descent:
    condition: "angle > 90 and angle <= 165"
    description: "Descent phase - squatting down"
  
  ascent:
    condition: "angle <= 90"
    description: "Bottom inflection point - starting ascent"

# Repetition counting rule
counter:
  trigger_state: ascent
  from_state: descent

# Temporal filter (seconds)
min_rep_duration: 0.8

# Form feedback rules
feedback:
  knees_caving:
    condition: "left_knee_x < left_ankle_x - 20"
    message: "Knees caving inward! Push your knees outward in line with toes."
    severity: warning
  
  leaning_forward:
    condition: "left_shoulder_x > left_hip_x + 50"
    message: "Leaning too far forward! Keep your chest proud and upright."
    severity: warning
  
  not_deep_enough:
    condition: "angle > 100 and angle < 130"
    message: "Squat deeper - aim for thighs parallel to ground!"
    severity: info

# Calibration settings
calibration:
  enabled: true
  reps: 3

# Smoothing settings
smoothing:
  enabled: true
  window: 3

# Visualization overlay
visualization:
  lines:
    - points: [left_shoulder, left_hip]
      color: [178, 102, 255]
      thickness: 2
    - points: [left_hip, left_knee]
      color: [178, 102, 255]
      thickness: 2
    - points: [right_shoulder, right_hip]
      color: [51, 153, 255]
      thickness: 2
    - points: [right_hip, right_knee]
      color: [51, 153, 255]
      thickness: 2
  
  circles:
    - point: left_shoulder
      color: [178, 102, 255]
      radius: 8
    - point: left_hip
      color: [178, 102, 255]
      radius: 8
    - point: left_knee
      color: [178, 102, 255]
      radius: 8
    - point: right_shoulder
      color: [51, 153, 255]
      radius: 8
    - point: right_hip
      color: [51, 153, 255]
      radius: 8
    - point: right_knee
      color: [51, 153, 255]
      radius: 8
  
  angle_display:
    - angle: primary
      position: left_knee
      offset: [10, -10]
      label: "Angle Left"
    - angle: right_side
      position: right_knee
      offset: [10, -10]
      label: "Angle Right"
